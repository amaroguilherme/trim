name: Keep API Alive

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Trim API to prevent cold starts..."
          curl --fail --silent --show-error https://amaroguilherme-trim-api.hf.space/api/v1/health